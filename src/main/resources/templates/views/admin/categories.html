<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{views/admin/layout :: layout(~{::body})}">

<body>
<div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="fw-bold mb-0">Quản lý loại sách</h4>
    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addBookModal">+ Thêm loại sách</button>
</div>

<table class="table table-borderless bg-white shadow-sm rounded align-middle">
    <thead class="small text-muted">
    <tr>
        <th>Mã loại</th>
        <th>Tên loại sách</th>
        <th class="text-center">Thao tác</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="c : ${categories}">
        <td>
            <span class="badge bg-secondary" th:text="${c.id}"></span>
        </td>
        <td th:text="${c.name}"></td>
        <td class="text-center">
            <button class="btn btn-sm btn-outline-primary me-1 edit-btn"
                    th:data-id="${c.id}"
                    th:data-name="${c.name}"
                    data-bs-toggle="modal"
                    data-bs-target="#editBookModal">
                Sửa
            </button>
            <a th:href="@{/admin/categories/delete/{id}(id=${c.id})}"
               class="btn btn-sm btn-outline-danger"
               onclick="return confirm('Bạn có chắc chắn muốn xóa danh mục này?')">
                Xóa
            </a>
        </td>
    </tr>
    </tbody>
</table>

<!-- ================= MODAL THÊM SÁCH ================= -->
<div class="modal fade" id="addBookModal">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
            <form th:action="@{/admin/categories/create}" method="post">
                <div class="modal-header">
                    <h5 class="modal-title">Thêm sách mới</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body row g-3">
                    <div class="col-md-6">
                        <label class="form-label">ID Thể loại</label>
                        <input class="form-control" name="id" required/>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Tên thể loại</label>
                        <input class="form-control" name="name" required/>
                    </div>

                </div>

                <div class="modal-footer">
                    <button class="btn btn-primary">Thêm mới</button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        Hủy
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- ================= MODAL CHỈNH SỬA ================= -->
<div class="modal fade" id="editBookModal">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
            <form th:action="@{/admin/categories/update}" method="post">

                <div class="modal-header">
                    <h5 class="modal-title">Chỉnh sửa thể loại</h5>
                    <button type="button"  class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body row g-3">
                    <div class="col-md-6">
                        <label class="form-label">ID Thể loại</label>
                        <input class="form-control" readonly name="id" id="editID"/>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Tên thể loại</label>
                        <input class="form-control" name="name" id="editName"/>
                    </div>


                <div class="modal-footer">
                    <button class="btn btn-primary">Cập nhật</button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        Hủy
                    </button>
                </div>
            </form>

        </div>
    </div>
</div>
<script th:src="@{/script/admin-categories.js}"></script>
</body>


</html>
