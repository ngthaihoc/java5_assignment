<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{views/admin/layout :: layout(~{::body})}"
>
  <body>
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h4 class="fw-bold mb-0">Quản lý loại sách</h4>
      <button class="btn btn-primary">+ Thêm loại sách</button>
    </div>

    <table
      class="table table-borderless bg-white shadow-sm rounded align-middle"
    >
      <thead class="small text-muted">
        <tr>
          <th>Mã loại</th>
          <th>Tên loại sách</th>
          <th class="text-center">Thao tác</th>
        </tr>
      </thead>

      <tbody>
        <tr th:each="c : ${categories}">
          <td>
            <span class="badge bg-secondary" th:text="${c.id}"></span>
          </td>
          <td th:text="${c.name}"></td>
          <td class="text-center">
            <button
              class="btn btn-sm btn-outline-primary me-1 edit-btn"
              th:data-id="${b.id}"
              th:data-title="${b.title}"
              th:data-author="${b.author}"
              th:data-price="${b.price}"
              th:data-quantity="${b.quantity}"
              th:data-image="${b.image}"
              data-bs-toggle="modal"
              data-bs-target="#editBookModal"
            >
              Sửa
            </button>
            <button class="btn btn-sm btn-outline-danger">Xóa</button>
          </td>
        </tr>
      </tbody>
    </table>

    <!-- ================= MODAL THÊM SÁCH ================= -->
    <div class="modal fade" id="addBookModal">
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
          <form th:action="@{/admin/books/create}" method="post">
            <div class="modal-header">
              <h5 class="modal-title">Thêm sách mới</h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
              ></button>
            </div>

            <div class="modal-body row g-3">
              <div class="col-md-6">
                <label class="form-label">Tên sách</label>
                <input class="form-control" name="title" required />
              </div>

              <div class="col-md-6">
                <label class="form-label">Tác giả</label>
                <input class="form-control" name="author" required />
              </div>

              <div class="col-md-6">
                <label class="form-label">Giá bán</label>
                <input class="form-control" name="price" />
              </div>

              <div class="col-md-6">
                <label class="form-label">Tồn kho</label>
                <input class="form-control" name="quantity" />
              </div>

              <div class="col-12">
                <label class="form-label">Ảnh bìa</label>
                <input type="file" class="form-control" id="addImageFile" />
                <input type="hidden" name="image" id="addImageUrl" />
                <img
                  id="addPreview"
                  class="mt-2 rounded"
                  style="max-height: 120px"
                />
              </div>
            </div>

            <div class="modal-footer">
              <button class="btn btn-primary">Thêm mới</button>
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Hủy
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- ================= MODAL CHỈNH SỬA ================= -->
    <div class="modal fade" id="editBookModal">
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
          <form th:action="@{/admin/books/update}" method="post">
            <input type="hidden" name="id" id="editId" />

            <div class="modal-header">
              <h5 class="modal-title">Chỉnh sửa sách</h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
              ></button>
            </div>

            <div class="modal-body row g-3">
              <div class="col-md-6">
                <label class="form-label">Tên sách</label>
                <input class="form-control" name="title" id="editTitle" />
              </div>

              <div class="col-md-6">
                <label class="form-label">Tác giả</label>
                <input class="form-control" name="author" id="editAuthor" />
              </div>

              <div class="col-md-6">
                <label class="form-label">Giá bán</label>
                <input class="form-control" name="price" id="editPrice" />
              </div>

              <div class="col-md-6">
                <label class="form-label">Tồn kho</label>
                <input class="form-control" name="quantity" id="editQuantity" />
              </div>

              <div class="col-12">
                <label class="form-label">Ảnh bìa</label>
                <input type="file" class="form-control" id="editImageFile" />
                <input type="hidden" name="image" id="editImageUrl" />
                <img
                  id="editPreview"
                  class="mt-2 rounded"
                  style="max-height: 120px"
                />
              </div>
            </div>

            <div class="modal-footer">
              <button class="btn btn-primary">Cập nhật</button>
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Hủy
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
