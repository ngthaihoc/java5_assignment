<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{views/admin/layout :: layout(~{::body})}"
>
  <body>
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h4 class="fw-bold mb-0">Quản lý khách hàng</h4>

      <button
        class="btn btn-primary"
        data-bs-toggle="modal"
        data-bs-target="#addCustomerModal"
      >
        Thêm khách hàng
      </button>
    </div>

    <div
      th:if="${error}"
      class="alert alert-danger alert-dismissible fade show"
      role="alert"
    >
      <span th:text="${error}"></span>
      <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- FILTER -->
    <form method="get" th:action="@{/admin/customers}">
      <div class="row g-2 mb-3">
        <div class="col-md-6">
          <input
            class="form-control"
            name="keyword"
            th:value="${param.keyword}"
            placeholder="Tìm theo tên, email..."
            onkeydown="if (event.key === 'Enter') this.form.submit();"
          />
        </div>

        <div class="col-md-3">
          <select
            class="form-select"
            name="status"
            onchange="this.form.submit()"
          >
            <option value="">Tất cả trạng thái</option>
            <option value="active" th:selected="${param.status=='active'}">
              Hoạt động
            </option>
            <option value="inactive" th:selected="${param.status=='inactive'}">
              Đã khóa
            </option>
          </select>
        </div>

        <div class="col-md-3">
          <select class="form-select" name="rank" onchange="this.form.submit()">
            <option value="">Tất cả hạng</option>
            <option value="Vàng" th:selected="${param.rank=='Vàng'}">
              Vàng
            </option>
            <option value="Bạc" th:selected="${param.rank=='Bạc'}">Bạc</option>
            <option value="Thường" th:selected="${param.rank=='Thường'}">
              Thường
            </option>
          </select>
        </div>
      </div>
    </form>

    <!-- ================= TABLE ================= -->
    <div class="bg-white rounded shadow-sm">
      <table class="table align-middle mb-0">
        <thead>
          <tr class="small text-muted">
            <th>Khách hàng</th>
            <th>Hạng</th>
            <th>Đơn hàng</th>
            <th>Tổng chi</th>
            <th>Trạng thái</th>
            <th class="text-center">Thao tác</th>
          </tr>
        </thead>

        <tbody>
          <tr th:each="c : ${customers}">
            <td>
              <div class="fw-medium" th:text="${c.name}"></div>
              <small class="text-muted">
                Email: <span th:text="${c.email}"></span>
              </small>
            </td>

            <td>
              <span
                class="badge rounded-pill"
                th:classappend="
                        ${c.rank=='Vàng'} ? 'bg-warning text-dark' :
                        (${c.rank=='Bạc'} ? 'bg-light text-dark border' :
                        'bg-secondary')"
                th:text="${c.rank}"
              >
              </span>
            </td>

            <td>
              <b th:text="${c.orders} + ' đơn'"></b><br />
              <small
                class="text-muted"
                th:text="${c.lastOrder != null
                        ? #temporals.format(c.lastOrder,'dd/MM/yyyy')
                        : 'Chưa có'}"
              >
              </small>
            </td>

            <td
              class="fw-bold"
              th:text="${#numbers.formatDecimal(c.total,0,'COMMA',0,'POINT')} + ' đ'"
            ></td>

            <td>
              <span
                th:if="${c.status}"
                class="badge bg-success-subtle text-success rounded-pill"
              >
                Hoạt động
              </span>
              <span
                th:if="${!c.status}"
                class="badge bg-danger-subtle text-danger rounded-pill"
              >
                Đã khóa
              </span>
            </td>

            <!--  ACTION  -->
            <td class="text-center">
              <!-- XEM -->
              <a
                href="javascript:void(0)"
                class="action-icon me-2"
                th:attr="data-email=${c.email}"
                onclick="showCustomerDetail(this)"
              >
                👁️
              </a>

              <!-- SỬA -->
              <a
                href="javascript:void(0)"
                class="action-icon me-2"
                th:attr="
                     data-email=${c.email},
                     data-name=${c.name}"
                onclick="openEditCustomer(this)"
              >
                ✏️
              </a>

              <!-- KHÓA / MỞ -->
              <a
                href="javascript:void(0)"
                class="action-icon"
                th:attr="data-email=${c.email}"
                onclick="toggleCustomer(this)"
              >
                <span th:if="${c.status}">🔒</span>
                <span th:if="${!c.status}">🔓</span>
              </a>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- MODAL XEM CHI TIẾT -->
    <div class="modal fade" id="customerModal" tabindex="-1">
      <div class="modal-dialog modal-lg">
        <div class="modal-content" id="customerModalContent"></div>
      </div>
    </div>

    <!-- MODAL THÊM KHÁCH HÀNG -->
    <div class="modal fade" id="addCustomerModal">
      <div class="modal-dialog modal-md modal-dialog-centered">
        <div class="modal-content">
          <form th:action="@{/admin/customers/create}" method="post">
            <div class="modal-header">
              <h5 class="modal-title fw-bold">Thêm khách hàng</h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
              ></button>
            </div>

            <div class="modal-body">
              <div class="mb-3">
                <label class="form-label">Họ tên</label>
                <input class="form-control" name="fullname" required />
              </div>

              <div class="mb-3">
                <label class="form-label">Email</label>
                <input
                  class="form-control"
                  name="email"
                  type="email"
                  required
                />
              </div>

              <div class="mb-3">
                <label class="form-label">Mật khẩu</label>

                <div class="input-group">
                  <input
                    class="form-control"
                    name="password"
                    type="password"
                    id="addPassword"
                    required
                  />

                  <button
                    class="btn btn-outline-secondary"
                    type="button"
                    onclick="togglePassword('addPassword', this)"
                  >
                    👁️
                  </button>
                </div>
              </div>
            </div>

            <div class="modal-footer">
              <button class="btn btn-primary">Tạo khách hàng</button>
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Hủy
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- MODAL CHỈNH SỬA KHÁCH HÀNG -->
    <div class="modal fade" id="editCustomerModal">
      <div class="modal-dialog modal-md modal-dialog-centered">
        <div class="modal-content">
          <form th:action="@{/admin/customers/update}" method="post">
            <div class="modal-header">
              <h5 class="modal-title fw-bold">Chỉnh sửa khách hàng</h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
              ></button>
            </div>

            <div class="modal-body">
              <input type="hidden" name="email" id="editEmail" />

              <div class="mb-3">
                <label class="form-label">Họ tên</label>
                <input
                  class="form-control"
                  name="fullname"
                  id="editName"
                  required
                />
              </div>

              <!-- MẬT KHẨU MỚI (KHÔNG BẮT BUỘC) -->
              <div class="mb-3">
                <label class="form-label">Mật khẩu mới</label>

                <div class="input-group">
                  <input
                    class="form-control"
                    name="password"
                    type="password"
                    id="editPassword"
                    placeholder="Để trống nếu không đổi"
                  />

                  <button
                    class="btn btn-outline-secondary"
                    type="button"
                    onclick="togglePassword('editPassword', this)"
                  >
                    👁️
                  </button>
                </div>
              </div>
            </div>

            <div class="modal-footer">
              <button class="btn btn-primary">Cập nhật</button>
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Hủy
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="/script/customer.js"></script>
  </body>
</html>
