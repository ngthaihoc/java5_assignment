<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="modal">

    <div class="modal-header">
        <h5 class="modal-title fw-bold">Chi tiết khách hàng</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
    </div>

    <div class="modal-body">

        <div class="row mb-4">
            <div class="col-md-6">
                <h5 class="fw-bold mb-1" th:text="${c.name}"></h5>
                <span class="badge bg-warning text-dark" th:text="${c.rank}"></span>

                <div class="mt-3 text-muted">
                    <div>📧 <span th:text="${c.email}"></span></div>
                    <div>📍 <span th:text="${c.address}"></span></div>
                    <div>
                        📅 Đăng ký:
                        <span th:text="${#temporals.format(c.registerDate,'dd/MM/yyyy')}"></span>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="p-3 rounded bg-primary-subtle mb-2">
                    <div class="text-primary">Tổng đơn hàng</div>
                    <div class="fs-4 fw-bold" th:text="${c.totalOrders}"></div>
                </div>

                <div class="p-3 rounded bg-success-subtle mb-2">
                    <div class="text-success">Tổng chi tiêu</div>
                    <div class="fs-4 fw-bold"
                         th:text="${#numbers.formatDecimal(c.totalAmount,0,'COMMA',0,'POINT')} + ' đ'">
                    </div>
                </div>

                <div class="p-3 rounded bg-info-subtle">
                    <div class="text-info">Đơn gần nhất</div>
                    <div class="fs-5 fw-bold"
                         th:text="${c.lastOrder != null
                           ? #temporals.format(c.lastOrder,'dd/MM/yyyy')
                           : '—'}">
                    </div>
                </div>
            </div>
        </div>

        <h6 class="fw-bold mb-3">📦 Lịch sử đơn hàng</h6>

        <div th:each="o : ${c.orders}"
             class="border rounded p-3 mb-2 d-flex justify-content-between align-items-center">

            <div>
                <div class="fw-bold">Đơn hàng #<span th:text="${o.id}"></span></div>
                <small class="text-muted">
                    <span th:text="${#temporals.format(o.date,'dd/MM/yyyy')}"></span>
                    • <span th:text="${o.itemCount}"></span> sản phẩm
                </small>
            </div>

            <div class="text-end">
                <div class="fw-bold"
                     th:text="${#numbers.formatDecimal(o.total,0,'COMMA',0,'POINT')} + ' đ'">
                </div>
                <span class="badge bg-success-subtle text-success"
                      th:text="${o.status}">
                </span>
            </div>
        </div>

    </div>

    

    <div class="modal-footer">

        <button type="button"
                class="btn btn-outline-secondary"
                data-bs-dismiss="modal">
            Đóng
        </button>

        <button type="button"
                class="btn"
                th:classappend="${c.status} ? 'btn-danger' : 'btn-success'"
                th:attr="data-email=${c.email}"
                onclick="toggleCustomer(this)">
            <span th:if="${c.status}">Khóa tài khoản</span>
            <span th:if="${!c.status}">Mở tài khoản</span>
        </button>

    </div>

</div>

</body>
</html>
