<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{views/admin/layout :: layout(~{::body})}">
<body>

<div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="fw-bold mb-0">Quản lý đơn hàng</h4>
    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addOrderModal">+ Tạo đơn hàng mới</button>
</div>

<div class="bg-white rounded shadow-sm p-3 mb-3">
    <form th:action="@{/admin/orders}" method="get" class="row g-2">
        <div class="col-md-8">
            <input name="search" class="form-control" placeholder="Tìm kiếm theo mã đơn hoặc tên khách hàng..." th:value="${param.search}">
        </div>
        <div class="col-md-3">
            <select name="status" class="form-select">
                <option value="">Tất cả trạng thái</option>
                <option value="0" th:selected="${param.status == '0'}">Đang xử lý</option>
                <option value="1" th:selected="${param.status == '1'}">Đang giao</option>
                <option value="2" th:selected="${param.status == '2'}">Đã giao</option>
                <option value="3" th:selected="${param.status == '3'}">Đã hủy</option>
            </select>
        </div>
        <div class="col-md-1">
            <button type="submit" class="btn btn-dark w-100">Lọc</button>
        </div>
    </form>
</div>

<table class="table table-borderless bg-white shadow-sm rounded align-middle">
    <thead class="small text-muted">
    <tr>
        <th>Mã đơn</th>
        <th>Khách hàng</th>
        <th>Ngày đặt</th>
        <th>Tổng tiền</th>
        <th>Trạng thái</th>
        <th class="text-center">Thao tác</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="o : ${orders}">
        <td>#<span th:text="${o.id}"></span></td>
        <td>
            <div class="fw-medium" th:text="${o.customer}"></div>
            <small class="text-muted" th:text="${o.email}"></small>
        </td>
        <td th:text="${o.date}"></td>
        <td class="fw-bold" th:text="${#numbers.formatDecimal(o.total,0,'COMMA',0,'POINT')} + 'đ'"></td>
        <td>
            <span th:if="${o.status == 0}" class="badge bg-secondary">Đang xử lý</span>
            <span th:if="${o.status == 1}" class="badge bg-warning text-dark">Đang giao</span>
            <span th:if="${o.status == 2}" class="badge bg-success">Đã giao</span>
            <span th:if="${o.status == 3}" class="badge bg-danger">Đã hủy</span>
        </td>
        <td class="text-center">
            <button class="btn btn-sm btn-outline-primary edit-order-btn" th:data-id="${o.id}" th:data-status="${o.status}" data-bs-toggle="modal" data-bs-target="#editOrderModal">Sửa</button>
            <a th:href="@{/admin/orders/delete/{id}(id=${o.id})}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Xác nhận xóa?')">Xóa</a>
        </td>
    </tr>
    </tbody>
</table>

<div class="modal fade" id="addOrderModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form th:action="@{/admin/orders/create}" method="post">
                <div class="modal-header"><h5>Tạo đơn hàng mới</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                <div class="modal-body">
                    <div class="mb-3"><label class="form-label">Tên khách hàng</label><input name="customer" class="form-control" required></div>
                    <div class="mb-3"><label class="form-label">Email</label><input name="email" class="form-control" required></div>
                    <div class="mb-3"><label class="form-label">Tổng tiền (VNĐ)</label><input type="number" name="total" class="form-control" required></div>
                </div>
                <div class="modal-footer"><button type="submit" class="btn btn-primary">Tạo mới</button></div>
            </form>
        </div>
    </div>
</div>

<div class="modal fade" id="editOrderModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <form th:action="@{/admin/orders/update}" method="post">
                <input type="hidden" name="id" id="editOrderId">
                <div class="modal-header"><h5>Cập nhật trạng thái</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                <div class="modal-body">
                    <select class="form-select" name="status" id="editOrderStatus">
                        <option value="0">Đang xử lý</option>
                        <option value="1">Đang giao</option>
                        <option value="2">Đã giao</option>
                        <option value="3">Đã hủy</option>
                    </select>
                </div>
                <div class="modal-footer"><button type="submit" class="btn btn-primary">Lưu</button></div>
            </form>
        </div>
    </div>
</div>

<script>
    document.querySelectorAll('.edit-order-btn').forEach(btn => {
        btn.onclick = function() {
            document.getElementById('editOrderId').value = this.dataset.id;
            document.getElementById('editOrderStatus').value = this.dataset.status;
        }
    });
</script>
</body>
</html>
