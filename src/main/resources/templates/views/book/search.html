<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" 
                th:replace="~{views/layout :: layout(~{::body})}">
<head>
    <meta charset="UTF-8">
    <title>Search</title>
</head>
<body>
    <link th:href="@{/css/search.css}" rel="stylesheet" />
    <div class="header-gradient py-5 text-center">
        <a th:href="@{/home}" class="link-dark link-offset-2 link-underline-opacity-0 fw-medium back-home">
            Trang chủ
        </a>
        <h1 class="fw-bold text-black">Tìm kiếm</h1>
    </div>
    <div class="container-fluid my-4">

        <h2 class="mb-4">Trang tìm kiếm</h2>
        <!-- Hiển thị ds gợi ý khi không tìm thấy -->
        <div class="text-center mb-4 fs-6" th:if="${bookPage.empty}">
            Không tìm thấy sách phù hợp với từ khóa <strong th:text="${keyword}"></strong>
            <h3 class="mt-5 mb-4">-- Gợi ý cho bạn --</h3>
            <div class="row row-cols-5 g-3 mt-3">
                <div class="col" th:each="book : ${allBooksPage.content}">
                    <div class="card book-card border-0 h-100">

                        <!-- <img th:src="${book.image}" class="card-img-top"> -->
                        <a th:href="@{/book/{id}(id=${book.id})}" class="img-wrapper">
                            <img src="https://bizweb.dktcdn.net/100/197/269/products/tam-ly-hoc-thanh-cong-304x472.jpg?v=1516592128997"
                                class="card-img-top" alt="Book image">
                        </a>

                        <div class="card-body">
                            <!-- <div class="book-title fs-5"
                            th:text="${book.title}">
                            Tên sách
                        </div> -->
                            <a th:href="@{/book/{id}(id=${book.id})}" class="text-decoration-none text-dark">
                                <div class="book-title fs-5" th:text="${book.title}">
                                </div>
                            </a>

                            <div class="d-flex justify-content-between gap-3 mb-1">
                                <span class="text-danger fw-bold fs-5"
                                    th:text="${#numbers.formatInteger(book.price, 0, 'COMMA')} + 'đ'">
                                </span>
                                <span class="text-muted fs-6" th:if="${showOldPrice}"
                                    th:text="${#numbers.formatDecimal(book.oldPrice, 0, 'COMMA')} + 'đ'">
                                </span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- Hiển thị ds -->
        <div class="row row-cols-5 g-3 mt-3">
            <div class="col" th:each="book : ${bookPage.content}">
                <div class="card book-card border-0 h-100">

                    <a th:href="@{/book/{id}(id=${book.id})}" class="img-wrapper">
                        <img src="https://bizweb.dktcdn.net/100/197/269/products/tam-ly-hoc-thanh-cong-304x472.jpg?v=1516592128997"
                            class="card-img-top" alt="Book image">
                    </a>

                    <div class="card-body">
                        <a th:href="@{/book/{id}(id=${book.id})}" class="text-decoration-none text-dark">
                            <div class="book-title fs-5" th:text="${book.title}">
                            </div>
                        </a>

                        <div class="d-flex justify-content-between gap-3 mb-1">
                            <span class="text-danger fw-bold fs-5"
                                th:text="${#numbers.formatInteger(book.price, 0, 'COMMA')} + 'đ'">
                            </span>
                            <span class="text-muted fs-6" th:if="${showOldPrice}"
                                th:text="${#numbers.formatDecimal(book.oldPrice, 0, 'COMMA')} + 'đ'">
                            </span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <nav class="mt-4 d-flex justify-content-center" th:if="${bookPage.totalPages > 1}">

            <ul class="pagination py-2">

                <!-- << -->
                <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
                    <a class="page-link" th:href="@{/search(page=${currentPage - 1}, keyword=${keyword})}">
                        &laquo;
                    </a>
                </li>

                <!-- Phân trang -->
                <li class="page-item" th:each="i : ${#numbers.sequence(1, totalPages)}"
                    th:classappend="${i == currentPage} ? 'active'">
                    <a class="page-link" th:href="@{/search(page=${i}, keyword=${keyword})}" th:text="${i}">
                    </a>
                </li>

                <!-- >> -->
                <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">
                    <a class="page-link" th:href="@{/search(page=${currentPage + 1}, keyword=${keyword})}">
                        &raquo;
                    </a>
                </li>

            </ul>
        </nav>

</body>
</html>
