<!DOCTYPE html>
<html
  lang="vi"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{views/layout :: layout(~{::body})}"
>
  <head>
    <meta charset="UTF-8" />
    <title>Tìm kiếm</title>
  </head>

  <body>
    <link th:href="@{/css/search.css}" rel="stylesheet" />

    <!-- HEADER -->
    <div class="header-gradient py-5 text-center">
      <a
        th:href="@{/home}"
        class="link-dark link-offset-2 link-underline-opacity-0 fw-medium back-home"
      >
        Trang chủ
      </a>
      <h1 class="fw-bold text-black">Tìm kiếm</h1>
    </div>

    <div class="search-content-wrapper my-4">
      <h2 class="mb-4">Trang tìm kiếm</h2>

      <!-- ================= FILTER + SORT ================= -->
      <form th:action="@{/search}" method="get" class="row g-3 mb-4">
        <input type="hidden" name="keyword" th:value="${keyword}" />

        <!-- Category -->
        <div class="col-md-3">
          <select name="category" class="form-select">
            <option value="">-- Tất cả loại sách --</option>
            <option
              th:each="c : ${categories}"
              th:value="${c.id}"
              th:text="${c.name}"
              th:selected="${c.id == selectedCategory}"
            ></option>
          </select>
        </div>

        <!-- Min price -->
        <div class="col-md-2">
          <input
            type="number"
            name="minPrice"
            th:value="${minPrice}"
            class="form-control"
            placeholder="Giá từ"
          />
        </div>

        <!-- Max price -->
        <div class="col-md-2">
          <input
            type="number"
            name="maxPrice"
            th:value="${maxPrice}"
            class="form-control"
            placeholder="Giá đến"
          />
        </div>

        <!-- Sort -->
        <div class="col-md-3">
          <select name="sort" class="form-select">
            <option value="">-- Sắp xếp --</option>
            <option value="az" th:selected="${sort == 'az'}">Tên A-Z</option>
            <option value="za" th:selected="${sort == 'za'}">Tên Z-A</option>
            <option value="priceAsc" th:selected="${sort == 'priceAsc'}">
              Giá tăng dần
            </option>
            <option value="priceDesc" th:selected="${sort == 'priceDesc'}">
              Giá giảm dần
            </option>
            <option value="newest" th:selected="${sort == 'newest'}">
              Mới nhất
            </option>
          </select>
        </div>

        <div class="col-md-2">
          <button class="btn btn-filter w-100">Lọc</button>
        </div>
      </form>

      <!-- ================= KHÔNG CÓ KẾT QUẢ ================= -->
      <div class="text-center mb-4 fs-6" th:if="${bookPage.empty}">
        Không tìm thấy sách phù hợp với từ khóa
        <strong th:text="${keyword}"></strong>

        <h3 class="mt-5 mb-4">-- Gợi ý cho bạn --</h3>

        <div class="row row-cols-5 g-3 mt-3">
          <div class="col" th:each="book : ${allBooksPage.content}">
            <div class="card book-card border-0 h-100">
              <a th:href="@{/book/{id}(id=${book.id})}" class="img-wrapper">
                <img
                  class="card-img-top"
                  th:src="${#strings.isEmpty(book.image)
                             ? '/images/books/default-book.png'
                             : '/images/books/' + book.image}"
                  th:alt="${book.title}"
                />
              </a>

              <div class="card-body">
                <a
                  th:href="@{/book/{id}(id=${book.id})}"
                  class="text-decoration-none text-dark"
                >
                  <div class="book-title fs-5" th:text="${book.title}"></div>
                </a>

                <div class="d-flex justify-content-between gap-3 mb-1">
                  <span
                    class="text-danger fw-bold fs-5"
                    th:text="${#numbers.formatInteger(book.price,0,'COMMA')} + 'đ'"
                  ></span>

                  <span
                    class="text-muted fs-6"
                    th:if="${showOldPrice}"
                    th:text="${#numbers.formatDecimal(book.oldPrice,0,'COMMA')} + 'đ'"
                  ></span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- ================= DANH SÁCH SÁCH ================= -->
      <div class="row row-cols-5 g-3 mt-3">
        <div class="col" th:each="book : ${bookPage.content}">
          <div class="card book-card border-0 h-100">
            <a th:href="@{/book/{id}(id=${book.id})}" class="img-wrapper">
              <img
                class="card-img-top"
                th:src="${#strings.isEmpty(book.image)
                         ? '/images/books/default-book.png'
                         : '/images/books/' + book.image}"
                th:alt="${book.title}"
              />
            </a>

            <div class="card-body">
              <a
                th:href="@{/book/{id}(id=${book.id})}"
                class="text-decoration-none text-dark"
              >
                <div class="book-title fs-5" th:text="${book.title}"></div>
              </a>

              <div class="d-flex justify-content-between gap-3 mb-1">
                <span
                  class="text-danger fw-bold fs-5"
                  th:text="${#numbers.formatInteger(book.price,0,'COMMA')} + 'đ'"
                ></span>

                <span
                  class="text-muted fs-6"
                  th:if="${showOldPrice}"
                  th:text="${#numbers.formatDecimal(book.oldPrice,0,'COMMA')} + 'đ'"
                ></span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- ================= PAGINATION ================= -->
      <nav
        class="mt-4 d-flex justify-content-center"
        th:if="${bookPage.totalPages > 1}"
      >
        <ul class="pagination py-2">
          <!-- Prev -->
          <li
            class="page-item"
            th:classappend="${currentPage == 1} ? 'disabled'"
          >
            <a
              class="page-link"
              th:href="@{/search(
                   page=${currentPage-1},
                   keyword=${keyword},
                   category=${selectedCategory},
                   minPrice=${minPrice},
                   maxPrice=${maxPrice},
                   sort=${sort}
                   )}"
            >
              &laquo;
            </a>
          </li>

          <!-- Pages -->
          <li
            class="page-item"
            th:each="i : ${#numbers.sequence(1,totalPages)}"
            th:classappend="${i==currentPage}? 'active'"
          >
            <a
              class="page-link"
              th:href="@{/search(
                   page=${i},
                   keyword=${keyword},
                   category=${selectedCategory},
                   minPrice=${minPrice},
                   maxPrice=${maxPrice},
                   sort=${sort}
                   )}"
              th:text="${i}"
            ></a>
          </li>

          <!-- Next -->
          <li
            class="page-item"
            th:classappend="${currentPage == totalPages} ? 'disabled'"
          >
            <a
              class="page-link"
              th:href="@{/search(
                   page=${currentPage+1},
                   keyword=${keyword},
                   category=${selectedCategory},
                   minPrice=${minPrice},
                   maxPrice=${maxPrice},
                   sort=${sort}
                   )}"
            >
              &raquo;
            </a>
          </li>
        </ul>
      </nav>
    </div>
  </body>
</html>
