<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{views/layout :: layout(~{::body})}"
>
  <body>
    <link th:href="@{/css/login.css}" rel="stylesheet" />

    <div class="container my-5">
      <div class="row justify-content-center">
        <div class="col-md-6 shadow p-5 bg-white rounded text-center">
          <h4 class="fw-bold text-uppercase mb-2">Thiết lập mật khẩu mới</h4>
          <p class="text-muted mb-4 small">
            Vui lòng nhập mật khẩu mới để hoàn tất việc khôi phục tài khoản.
          </p>

          <form
            id="changePasswordForm"
            th:action="@{/change-password}"
            method="post"
          >
            <div class="mb-3 text-start">
              <label for="newPassword" class="form-label small fw-bold"
                >Mật khẩu mới <span class="text-danger">*</span></label
              >
              <input
                type="password"
                class="form-control rounded-1"
                id="newPassword"
                name="newPassword"
                placeholder="Nhập mật khẩu mới"
                required
              />
            </div>

            <div class="mb-3 text-start">
              <label for="confirmPassword" class="form-label small fw-bold"
                >Xác nhận mật khẩu mới <span class="text-danger">*</span></label
              >
              <input
                type="password"
                class="form-control rounded-1"
                id="confirmPassword"
                name="confirmPassword"
                placeholder="Nhập lại mật khẩu mới"
                required
              />
              <div
                id="passwordError"
                class="text-danger small mt-2 fw-bold"
                style="display: none"
              >
                <i class="bi bi-exclamation-circle"></i> Mật khẩu xác nhận không
                khớp!
              </div>
            </div>

            <button
              type="submit"
              class="btn mt-3 w-100 bg-orange text-white fw-bold py-2 rounded-1 shadow-sm text-uppercase"
            >
              Đổi mật khẩu
            </button>
          </form>

          <div class="mt-4">
            <small class="text-muted">
              Quay lại trang
              <a
                th:href="@{/login}"
                class="text-primary text-decoration-none fw-bold"
                >Đăng nhập</a
              >
            </small>
          </div>
        </div>
      </div>
    </div>

    <script>
      document
        .getElementById("changePasswordForm")
        .addEventListener("submit", function (event) {
          const newPass = document.getElementById("newPassword").value;
          const confirmPass = document.getElementById("confirmPassword").value;
          const errorDiv = document.getElementById("passwordError");

          if (newPass !== confirmPass) {
            event.preventDefault(); // Chặn gửi form
            errorDiv.style.display = "block"; // Hiện lỗi
            document
              .getElementById("confirmPassword")
              .classList.add("is-invalid");
          } else {
            errorDiv.style.display = "none";
            document
              .getElementById("confirmPassword")
              .classList.remove("is-invalid");
          }
        });
    </script>
  </body>
</html>
