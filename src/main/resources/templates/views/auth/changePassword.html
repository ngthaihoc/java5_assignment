
<div th:fragment="content" xmlns:th="http://www.thymeleaf.org">
    <h4 class="mb-4 text-uppercase fw-bold">Đổi mật khẩu</h4>

    <form action="#" method="post" style="max-width: 500px;">
        <div class="mb-3">
            <label for="currentPassword" class="form-label fw-bold">Mật khẩu hiện tại</label>
            <input type="password" class="form-control" id="currentPassword" placeholder="Nhập mật khẩu cũ">
        </div>

        <div class="mb-3">
            <label for="newPassword" class="form-label fw-bold">Mật khẩu mới</label>
            <input type="password" class="form-control" id="newPassword" placeholder="Nhập mật khẩu mới">
        </div>

        <div class="mb-3">
            <label for="confirmPassword" class="form-label fw-bold">Xác nhận mật khẩu mới</label>
            <input type="password" class="form-control" id="confirmPassword" placeholder="Nhập lại mật khẩu mới">
        </div>

        <div class="mt-4">
            <button type="submit" class="btn text-white px-4 py-2"
                    style="background-color: #F5AFAF; border: none;">
                Đổi mật khẩu
            </button>
        </div>
    </form>
</div>
