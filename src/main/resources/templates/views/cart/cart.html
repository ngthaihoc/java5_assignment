<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{views/layout :: layout(~{::section})}">

<section class="bg-light pb-4 min-vh-100">

  <!-- HEADER -->
  <div class="bg-white border-bottom mb-4">
    <div class="container d-flex justify-content-between align-items-center py-3">
      <a th:href="@{/home}" class="text-decoration-none text-muted">
        ← Tiếp tục mua sắm
      </a>
      <h4 class="fw-bold mb-0">Giỏ hàng</h4>
      <a th:if="${!#lists.isEmpty(cartItems)}"
         th:href="@{/cart/clear}"
         class="text-danger text-decoration-none">
        Xóa tất cả
      </a>
    </div>
  </div>

  <div class="container">

    <!-- ALERT ĐẶT HÀNG THÀNH CÔNG -->
    <div th:if="${orderSuccess}"
         class="alert alert-success alert-dismissible fade show position-fixed shadow"
         style="top:20px; right:20px; z-index:9999">
      <i class="fa-solid fa-circle-check me-2"></i>
      Đặt hàng thành công!
      <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- EMPTY CART -->
    <div th:if="${#lists.isEmpty(cartItems)}" class="text-center py-5">
      <i class="fa-solid fa-cart-shopping fs-1 text-muted mb-3"></i>
      <h5 class="fw-bold">Giỏ hàng trống</h5>
      <p class="text-muted">Hãy thêm sản phẩm để tiếp tục mua sắm</p>
      <a th:href="@{/home}" class="btn btn-primary px-4">
        Khám phá sách
      </a>
    </div>

    <!-- CART CONTENT -->
    <div th:if="${!#lists.isEmpty(cartItems)}" class="row g-4">

      <!-- LEFT -->
      <div class="col-lg-8">

        <div th:each="item : ${cartItems}"
             class="bg-white rounded shadow-sm p-4 mb-3">

          <div class="row align-items-center">

            <!-- IMAGE -->
            <div class="col-md-3">
              <img th:src="@{${item.image}}"
                   class="img-fluid rounded"
                   style="height:140px;object-fit:cover">
            </div>

            <!-- INFO -->
            <div class="col-md-6">
              <h6 class="fw-bold mb-1" th:text="${item.title}"></h6>
              <div class="text-muted small" th:text="${item.author}"></div>
              <div class="text-muted small mb-2" th:text="${item.category}"></div>

              <span class="fw-bold text-primary"
                    th:text="${#numbers.formatDecimal(item.price,0,'COMMA',0,'POINT')} + ' đ'">
              </span>
            </div>

            <!-- QTY -->
            <div class="col-md-3 text-end">

              <div class="d-flex justify-content-end align-items-center gap-2">

                <!-- GIẢM -->
                <a th:href="@{/cart/update(id=${item.cartDetailId},qty=${item.quantity - 1})}"
                   class="btn btn-outline-secondary btn-sm">−</a>

                <span class="fw-bold px-2" th:text="${item.quantity}"></span>

                <!-- TĂNG -->
                <a th:href="@{/cart/update(id=${item.cartDetailId},qty=${item.quantity + 1})}"
                   class="btn btn-outline-secondary btn-sm">+</a>
              </div>

              <div class="fw-bold mt-3"
                   th:text="${#numbers.formatDecimal(item.total,0,'COMMA',0,'POINT')} + ' đ'">
              </div>

              <a th:href="@{/cart/remove/{id}(id=${item.cartDetailId})}"
                 class="text-danger d-inline-block mt-2">
                <i class="fa-solid fa-trash"></i>
              </a>

            </div>
          </div>
        </div>
      </div>

      <!-- RIGHT -->
      <div class="col-lg-4">
        <div class="bg-white rounded shadow-sm p-4">

          <h5 class="fw-bold mb-3">Tổng đơn hàng</h5>

          <div class="d-flex justify-content-between mb-2">
            <span class="text-muted">Tạm tính:</span>
            <span th:text="${#numbers.formatDecimal(cartTotal,0,'COMMA',0,'POINT')} + ' đ'"></span>
          </div>

          <div class="d-flex justify-content-between mb-2">
            <span class="text-muted">Phí vận chuyển:</span>
            <span class="text-success">Miễn phí</span>
          </div>

          <hr>

          <div class="d-flex justify-content-between fw-bold fs-5 mb-4">
            <span>Tổng cộng:</span>
            <span class="text-primary"
                  th:text="${#numbers.formatDecimal(cartTotal,0,'COMMA',0,'POINT')} + ' đ'">
            </span>
          </div>

          <a th:href="@{/checkout}" class="btn btn-primary w-100 mb-2">
            Tiến hành thanh toán
          </a>

          <a th:href="@{/}" class="btn btn-outline-secondary w-100">
            Tiếp tục mua sắm
          </a>

        </div>
      </div>

    </div>
  </div>

</section>
</html>
