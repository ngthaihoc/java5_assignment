<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{views/layout :: layout(~{::body})}"
>
  <head>
    <title>Chi tiết đơn hàng</title>
  </head>
  <body>
    <link th:href="@{/css/cart.css}" rel="stylesheet" />

    <div class="card-box card-content">
      <h2>Chi tiết đơn hàng #DH001</h2>
      <table>
        <thead>
          <tr>
            <th>Tên sách</th>
            <th>Giá</th>
            <th>Số lượng</th>
            <th>Thành tiền</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Lập trình Java</td>
            <td>100.000đ</td>
            <td>2</td>
            <td>200.000đ</td>
          </tr>
        </tbody>
      </table>

      <div style="margin-top: 20px">
        <h3>Tổng tiền: <span style="color: #f97316">200.000đ</span></h3>
        <a
          href="/orders"
          style="color: #f97316; text-decoration: none; font-weight: bold"
          >Quay lại</a
        >
      </div>
    </div>
  </body>
</html>
