<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Tài khoản của bạn</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link th:href="@{/css/index.css}" rel="stylesheet" />
    <style>
      :root {
        --pink-light: #f9dfdf;
        --pink-dark: #f5afaf;
        --text-dark: #333;
      }
      body {
        background-color: #f8f9fa;
      }
      .account-banner {
        background: linear-gradient(
          to top,
          var(--pink-light),
          var(--pink-dark)
        );
        padding: 60px 0;
        margin-bottom: 40px;
      }
      .breadcrumb-custom a {
        color: #555;
        text-decoration: none;
        font-weight: 600;
      }
      .breadcrumb-custom a:hover {
        color: #000;
        text-decoration: underline;
      }
      .breadcrumb-custom span {
        color: #fff;
        font-weight: bold;
        text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
      }
      .sidebar-card {
        background-color: white;
        border-radius: 10px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        overflow: hidden;
        border: 1px solid var(--pink-light);
      }
      .user-greeting {
        background-color: var(--pink-light);
        padding: 20px;
        color: var(--text-dark);
        border-bottom: 2px solid var(--pink-dark);
      }
      .account-nav .list-group-item {
        border: none;
        border-bottom: 1px solid #eee;
        padding: 15px 20px;
        color: #555;
        transition: all 0.3s;
      }
      .account-nav .list-group-item:hover {
        background-color: #fff0f0;
        color: var(--text-dark);
        padding-left: 25px;
      }
      .account-nav .list-group-item.active-link {
        background-color: var(--pink-dark);
        color: white;
        font-weight: bold;
      }
      .content-card {
        background-color: white;
        border-radius: 10px;
        padding: 30px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        min-height: 400px;
      }
    </style>
  </head>

  <body>
    <header th:replace="~{components/navbar :: navbar}"></header>

    <section class="account-banner text-center">
      <div class="container">
        <h1 class="display-5 fw-bold text-white mb-3">Tài khoản</h1>
        <div class="breadcrumb-custom fs-5">
          <a th:href="@{/}" class="me-2"
            ><i class="fas fa-home me-1"></i>Trang chủ</a
          >
          <span class="mx-2">/</span>
          <span>Trang khách hàng</span>
        </div>
      </div>
    </section>

    <div class="container mb-5">
      <div class="row g-4">
        <div class="col-lg-4 col-md-5">
          <div class="sidebar-card">
            <div class="user-greeting">
              <h5 class="mb-0 fw-bold">
                Xin chào,
                <span
                  th:text="${userFullname != null ? userFullname : 'Nguyễn Học'}"
                  >User</span
                >
                !
              </h5>
            </div>

            <div class="list-group account-nav">
              <a
                th:href="@{/account/profile}"
                class="list-group-item list-group-item-action"
                th:classappend="${currentTab == 'profile'} ? 'active-link'"
              >
                <i class="fas fa-user-circle me-2"></i> Thông tin tài khoản
              </a>

              <a
                th:href="@{/account/orders}"
                class="list-group-item list-group-item-action"
                th:classappend="${currentTab == 'orders'} ? 'active-link'"
              >
                <i class="fas fa-shopping-bag me-2"></i> Đơn hàng của bạn
              </a>

              <a
                th:href="@{/account/change-password}"
                class="list-group-item list-group-item-action"
                th:classappend="${currentTab == 'password'} ? 'active-link'"
              >
                <i class="fas fa-key me-2"></i> Đổi mật khẩu
              </a>

              <a
                th:href="@{/account/address}"
                class="list-group-item list-group-item-action"
                th:classappend="${currentTab == 'address'} ? 'active-link'"
              >
                <i class="fas fa-map-marker-alt me-2"></i> Sổ địa chỉ
              </a>

              <a
                th:href="@{/account/statistics}"
                class="list-group-item list-group-item-action"
                th:classappend="${currentTab == 'statistics'} ? 'active-link'"
              >
                <i class="fas fa-chart-line me-2"></i> Thống kê (Admin)
              </a>

              <a
                th:href="@{/logout}"
                class="list-group-item list-group-item-action text-danger"
              >
                <i class="fas fa-sign-out-alt me-2"></i> Đăng xuất
              </a>
            </div>
          </div>
        </div>

        <div class="col-lg-8 col-md-7">
          <div class="content-card h-100">
            <div th:switch="${currentTab}">
              <div th:case="'profile'">
                <div th:replace="~{components/profileInfo :: content}"></div>
              </div>

              <div th:case="'orders'">
                <div th:replace="~{components/orderHistory :: content}"></div>
              </div>

              <div th:case="'password'">
                <div th:replace="~{components/changePassword :: content}"></div>
              </div>

              <div th:case="'address'">
                <div th:replace="~{components/address :: content}"></div>
              </div>

              <div th:case="'statistics'">
                <div th:replace="~{components/statistics :: content}"></div>
              </div>

              <div th:case="*">
                <div th:replace="~{components/profileInfo :: content}"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <footer th:replace="~{components/footer :: footer}"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
