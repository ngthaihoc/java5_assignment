<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{views/layout :: layout(~{::section})}"
>
  <section class="bg-light py-4">
    <link rel="stylesheet" th:href="@{/css/cart.css}" />

    <!-- HEADER -->
    <div class="container mb-4">
      <a th:href="@{/cart}" class="text-decoration-none text-muted">
        ← Quay lại giỏ hàng
      </a>
      <h4 class="fw-bold mt-2">Thanh toán</h4>
    </div>

    <form th:action="@{/checkout}" method="post" th:object="${orderForm}">
      <div class="container">
        <div class="row g-4">
          <!-- ================= LEFT ================= -->
          <div class="col-lg-8">
            <!-- THÔNG TIN KHÁCH HÀNG -->
            <div class="bg-white rounded shadow-sm p-4 mb-4">
              <h6 class="fw-bold mb-3">
                <i class="fa-regular fa-user me-2 text-primary"></i>
                Thông tin khách hàng
              </h6>

              <div class="mb-3">
                <label class="form-label">Họ và tên *</label>
                <input th:field="*{fullName}" class="form-control" required />
              </div>

              <div class="row">
                <div class="col-md-6 mb-3">
                  <label>Email *</label>
                  <input th:field="*{email}" class="form-control" readonly />
                </div>
                <div class="col-md-6 mb-3">
                  <label>Số điện thoại *</label>
                  <input th:field="*{phone}" class="form-control" required />
                </div>
              </div>
            </div>

            <!-- ĐỊA CHỈ GIAO HÀNG -->
            <div class="bg-white rounded shadow-sm p-4 mb-4">
              <h6 class="fw-bold mb-3">
                <i class="fa-solid fa-location-dot me-2 text-primary"></i>
                Địa chỉ giao hàng
              </h6>

              <div class="mb-3">
                <label>Địa chỉ cụ thể *</label>
                <input th:field="*{address}" class="form-control" required />
              </div>

              <div>
                <label>Ghi chú (tuỳ chọn)</label>
                <textarea
                  th:field="*{note}"
                  class="form-control"
                  rows="3"
                ></textarea>
              </div>
            </div>

            <!-- PHƯƠNG THỨC VẬN CHUYỂN -->
            <div class="bg-white rounded shadow-sm p-4 mb-4">
              <h6 class="fw-bold mb-3">
                <i class="fa-solid fa-truck me-2 text-primary"></i>
                Phương thức vận chuyển
              </h6>

              <div class="form-check mb-2">
                <input
                  class="form-check-input"
                  type="radio"
                  value="standard"
                  checked
                />
                <label class="form-check-label gap-3">
                  Giao hàng tiêu chuẩn (3–5 ngày)
                  <span class="text-success float-end"> Miễn phí</span>
                </label>
              </div>

              <div class="form-check">
                <input class="form-check-input" type="radio" value="express" />
                <label class="form-check-label">
                  Giao hàng nhanh (1–2 ngày)
                  <span class="float-end">50.000 đ</span>
                </label>
              </div>
            </div>

            <!-- PHƯƠNG THỨC THANH TOÁN -->
            <div class="bg-white rounded shadow-sm p-4">
              <h6 class="fw-bold mb-3">
                <i class="fa-regular fa-credit-card me-2 text-primary"></i>
                Phương thức thanh toán
              </h6>

              <div class="form-check mb-2">
                <input
                  class="form-check-input"
                  type="radio"
                  value="cod"
                  checked
                />
                <label class="form-check-label">
                  Thanh toán khi nhận hàng (COD)
                </label>
              </div>

              <div class="form-check mb-2">
                <input class="form-check-input" type="radio" value="bank" />
                <label class="form-check-label"> Chuyển khoản ngân hàng </label>
              </div>

              <div class="form-check">
                <input
                  class="form-check-input"
                  type="radio"
                  th:field="*{paymentMethod}"
                  value="card"
                />
                <label class="form-check-label"> Thẻ tín dụng / ghi nợ </label>
              </div>
            </div>
          </div>

          <!-- RIGHT -->
          <div class="col-lg-4">
            <div class="bg-white rounded shadow-sm p-4">
              <h6 class="fw-bold mb-3">Đơn hàng</h6>

              <div style="max-height: 300px; overflow: auto">
                <div
                  th:each="item : ${cartItems}"
                  class="d-flex justify-content-between mb-2"
                >
                  <div>
                    <div th:text="${item.title}"></div>
                    <small class="text-muted"
                      >x<span th:text="${item.quantity}"></span
                    ></small>
                  </div>
                  <div
                    class="fw-bold"
                    th:text="${#numbers.formatDecimal(item.total,0,'COMMA',0,'POINT')} + ' đ'"
                  ></div>
                </div>
              </div>

              <hr />

              <div class="d-flex justify-content-between mb-2">
                <span>Tạm tính:</span>
                <span
                  th:text="${#numbers.formatDecimal(cartTotal,0,'COMMA',0,'POINT')} + ' đ'"
                ></span>
              </div>

              <div class="d-flex justify-content-between mb-2">
                <span>Phí vận chuyển:</span>
                <span class="text-success">Miễn phí</span>
              </div>

              <hr />

              <div class="d-flex justify-content-between fw-bold fs-5 mb-3">
                <span>Tổng cộng:</span>
                <span
                  class="text-primary"
                  th:text="${#numbers.formatDecimal(cartTotal,0,'COMMA',0,'POINT')} + ' đ'"
                >
                </span>
              </div>

              <button class="btn btn-checkout w-100 mb-2">Đặt hàng</button>

              <a th:href="@{/cart}" class="btn btn-outline-secondary w-100">
                Quay lại giỏ hàng
              </a>

              <div class="text-success small mt-3">
                <i class="fa-solid fa-lock me-1"></i>
                Thanh toán bảo mật & an toàn
              </div>
            </div>
          </div>
        </div>
      </div>
    </form>
  </section>
</html>
