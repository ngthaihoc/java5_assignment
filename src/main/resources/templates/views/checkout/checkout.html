<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{views/layout :: layout(~{::section})}">
<section class="bg-light py-4">
  <link rel="stylesheet" th:href="@{/css/cart.css}" />

  <!-- HEADER -->
  <div class="container mb-4">
    <a th:href="@{/cart}" class="text-decoration-none text-muted">
      ← Quay lại giỏ hàng
    </a>
    <h4 class="fw-bold mt-2">Thanh toán</h4>
  </div>

  <form th:action="@{/checkout}" method="post" th:object="${orderForm}">
    <div class="container">
      <div class="row g-4">
        <!-- ================= LEFT ================= -->
        <div class="col-lg-8">
          <!-- THÔNG TIN KHÁCH HÀNG -->
          <div class="bg-white rounded shadow-sm p-4 mb-4">
            <h6 class="fw-bold mb-3">
              <i class="fa-regular fa-user me-2 text-primary"></i>
              Thông tin khách hàng
            </h6>

            <div class="mb-3">
              <label class="form-label">Họ và tên *</label>
              <input th:field="*{fullName}" class="form-control" required />
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label>Email *</label>
                <input th:field="*{email}" class="form-control" readonly />
              </div>
              <div class="col-md-6 mb-3">
                <label>Số điện thoại *</label>
                <input th:field="*{phone}" class="form-control" required />
              </div>
            </div>
          </div>

          <!-- ĐỊA CHỈ GIAO HÀNG -->
          <div class="bg-white rounded shadow-sm p-4 mb-4">
            <h6 class="fw-bold mb-3">
              <i class="fa-solid fa-location-dot me-2 text-primary"></i>
              Địa chỉ giao hàng
            </h6>

            <div class="mb-3">
              <label>Địa chỉ cụ thể *</label>
              <input th:field="*{address}" class="form-control" required />
            </div>

            <div>
              <label>Ghi chú (tuỳ chọn)</label>
              <textarea th:field="*{note}" class="form-control" rows="3"></textarea>
            </div>
          </div>

          <!-- PHƯƠNG THỨC VẬN CHUYỂN -->
          <div class="bg-white rounded shadow-sm p-4 mb-4">
            <h6 class="fw-bold mb-3">
              <i class="fa-solid fa-truck me-2 text-primary"></i>
              Phương thức vận chuyển
            </h6>

            <!-- Hidden input để gửi về backend -->
            <input type="hidden" th:field="*{shippingMethod}" id="shippingMethodValue" value="standard" />

            <div class="form-check mb-2">
              <input class="form-check-input" type="radio" name="shippingMethodRadio" id="shippingStandard"
                value="standard" checked onchange="updateShippingFee()" />
              <label class="form-check-label w-100" for="shippingStandard">
                <div class="d-flex justify-content-between">
                  <span>Giao hàng tiêu chuẩn (3–5 ngày)</span>
                  <span class="text-success fw-bold">Miễn phí</span>
                </div>
              </label>
            </div>

            <div class="form-check">
              <input class="form-check-input" type="radio" name="shippingMethodRadio" id="shippingExpress"
                value="express" onchange="updateShippingFee()" />
              <label class="form-check-label w-100" for="shippingExpress">
                <div class="d-flex justify-content-between">
                  <span>Giao hàng nhanh (1–2 ngày)</span>
                  <span class="text-danger fw-bold">50.000 đ</span>
                </div>
              </label>
            </div>
          </div>

          <!-- PHƯƠNG THỨC THANH TOÁN -->
          <div class="bg-white rounded shadow-sm p-4">
            <h6 class="fw-bold mb-3">
              <i class="fa-regular fa-credit-card me-2 text-primary"></i>
              Phương thức thanh toán
            </h6>

            <div class="form-check mb-2">
              <input class="form-check-input" type="radio" name="paymentMethod" th:field="*{paymentMethod}"
                id="paymentCOD" value="cod" checked />
              <label class="form-check-label" for="paymentCOD">
                <i class="fa-solid fa-money-bill-wave me-2 text-success"></i>
                Thanh toán khi nhận hàng (COD)
              </label>
            </div>

            <div class="form-check mb-2">
              <input class="form-check-input" type="radio" name="paymentMethod" id="paymentBank" value="bank"
                disabled />
              <label class="form-check-label text-muted" for="paymentBank">
                <i class="fa-solid fa-building-columns me-2"></i>
                Chuyển khoản ngân hàng
                <span class="badge bg-secondary ms-2">Sắp ra mắt</span>
              </label>
            </div>

            <div class="form-check">
              <input class="form-check-input" type="radio" name="paymentMethod" id="paymentCard" value="card"
                disabled />
              <label class="form-check-label text-muted" for="paymentCard">
                <i class="fa-regular fa-credit-card me-2"></i>
                Thẻ tín dụng / ghi nợ
                <span class="badge bg-secondary ms-2">Sắp ra mắt</span>
              </label>
            </div>
          </div>
        </div>

        <!-- RIGHT -->
        <div class="col-lg-4">
          <div class="bg-white rounded shadow-sm p-4">
            <h6 class="fw-bold mb-3">Đơn hàng</h6>

            <div style="max-height: 300px; overflow: auto">
              <div th:each="item : ${cartItems}" class="d-flex justify-content-between mb-2">
                <div>
                  <div th:text="${item.title}"></div>
                  <small class="text-muted">x<span th:text="${item.quantity}"></span></small>
                </div>
                <div class="fw-bold" th:text="${#numbers.formatDecimal(item.total,0,'COMMA',0,'POINT')} + ' đ'"></div>
              </div>
            </div>

            <hr />

            <div class="d-flex justify-content-between mb-2">
              <span>Tạm tính:</span>
              <span id="subtotal" th:text="${#numbers.formatDecimal(cartTotal,0,'COMMA',0,'POINT')} + ' đ'"></span>
            </div>

            <div class="d-flex justify-content-between mb-2">
              <span>Phí vận chuyển:</span>
              <span id="shippingFeeText" class="text-success fw-bold">Miễn phí</span>
            </div>

            <hr />

            <div class="d-flex justify-content-between fw-bold fs-5 mb-3">
              <span>Tổng cộng:</span>
              <span class="text-primary" id="totalPrice"
                th:text="${#numbers.formatDecimal(cartTotal,0,'COMMA',0,'POINT')} + ' đ'">
              </span>
            </div>

            <button class="btn btn-checkout w-100 mb-2">Đặt hàng</button>

            <a th:href="@{/cart}" class="btn btn-outline-secondary w-100">
              Quay lại giỏ hàng
            </a>

            <div class="text-success small mt-3">
              <i class="fa-solid fa-lock me-1"></i>
              Thanh toán bảo mật & an toàn
            </div>
          </div>
        </div>
      </div>
    </div>
  </form>

  <script th:inline="javascript">
    /*<![CDATA[*/
    const cartTotal = /*[[${cartTotal}]]*/ 0;
    const shippingFeeExpress = 50000;

    function formatCurrency(amount) {
      return amount.toLocaleString('vi-VN') + ' đ';
    }

    function updateShippingFee() {
      const isExpress = document.getElementById('shippingExpress').checked;
      const shippingFee = isExpress ? shippingFeeExpress : 0;
      const total = cartTotal + shippingFee;

      // Update hidden input value for backend
      document.getElementById('shippingMethodValue').value = isExpress ? 'express' : 'standard';

      // Update shipping fee display
      const shippingFeeText = document.getElementById('shippingFeeText');
      if (isExpress) {
        shippingFeeText.textContent = formatCurrency(shippingFee);
        shippingFeeText.className = 'text-danger fw-bold';
      } else {
        shippingFeeText.textContent = 'Miễn phí';
        shippingFeeText.className = 'text-success fw-bold';
      }

      // Update total price
      document.getElementById('totalPrice').textContent = formatCurrency(total);
    }
    /*]]>*/
  </script>
</section>

</html>
