<div th:fragment="content" xmlns:th="http://www.thymeleaf.org">
  <h4 class="mb-4 text-uppercase fw-bold">Đơn hàng của bạn</h4>

  <div class="table-responsive">
    <table class="table table-hover table-bordered align-middle" th:if="${orders != null and !orders.isEmpty()}">
      <thead class="text-white" style="background-color: #f36f21">
        <tr>
          <th scope="col">Đơn hàng</th>
          <th scope="col">Ngày</th>
          <th scope="col">Địa chỉ</th>
          <th scope="col">Giá trị đơn hàng</th>
          <th scope="col">TT thanh toán</th>
          <th scope="col">Trạng thái</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="order : ${orders}" th:onclick="|window.location.href='@{/order/detail/{id}(id=${order.id})}'|"
          style="cursor: pointer;" class="order-row">
          <td>
            <p th:text="'#' + ${order.id}" class="fw-bold text-dark mb-0">#1001</p>
          </td>
          <td>
            <p th:text="${#temporals.format(order.createDate, 'dd/MM/yyyy HH:mm')}" class="mb-0"></p>
          </td>
          <td>
            <p th:text="${order.address}" class="mb-0 text-truncate" style="max-width: 200px;"></p>
          </td>
          <td class="fw-bold text-danger">
            <p th:text="${#numbers.formatDecimal(order.totalPrice, 0, 'COMMA', 0, 'POINT')} + ' đ'" class="mb-0"></p>
          </td>
          <td>
            <span class="badge" style="background-color: #d4edda; color: #155724">Đã thanh toán</span>
          </td>
          <td>
            <span class="badge" th:classappend="${order.status == 0 ? 'bg-info' : 
                              order.status == 1 ? 'bg-warning' : 
                              order.status == 2 ? 'bg-success' : 'bg-secondary'}" th:text="${order.status == 0 ? 'Mới' :
                        order.status == 1 ? 'Đang giao' :
                        order.status == 2 ? 'Hoàn tất' : 'Đã hủy'}">
            </span>
          </td>
        </tr>
      </tbody>
    </table>

    <div class="text-center py-5" th:if="${orders == null or orders.isEmpty()}">
      <i class="fas fa-shopping-bag fa-3x text-muted mb-3"></i>
      <h4 class="text-muted">Bạn chưa có đơn hàng nào</h4>
      <p class="text-muted">Hãy khám phá và đặt hàng ngay!</p>
      <a th:href="@{/home}" class="btn btn-primary mt-3">
        <i class="fas fa-book me-2"></i>Khám phá sách
      </a>
    </div>
  </div>

  <style>
    .order-row:hover {
      background-color: #f8f9fa;
      transform: scale(1.01);
      transition: all 0.2s ease;
    }
  </style>
</div>
</div>
