<div th:fragment="content" xmlns:th="http://www.thymeleaf.org">
    <h4 class="mb-4 text-uppercase fw-bold">Đổi mật khẩu</h4>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>

    <form th:action="@{/auth/account/change-password}" method="post" style="max-width: 500px">
        <div class="mb-3">
            <label for="currentPassword" class="form-label fw-bold">Mật khẩu hiện tại</label>
            <input type="password" name="oldPass" class="form-control" id="currentPassword"
                placeholder="Nhập mật khẩu cũ" required />
        </div>

        <div class="mb-3">
            <label for="newPassword" class="form-label fw-bold">Mật khẩu mới</label>
            <input type="password" name="newPass" class="form-control" id="newPassword" placeholder="Nhập mật khẩu mới"
                required />
        </div>

        <div class="mb-3">
            <label for="confirmPassword" class="form-label fw-bold">Xác nhận mật khẩu mới</label>
            <input type="password" name="confirmPass" class="form-control" id="confirmPassword"
                placeholder="Nhập lại mật khẩu mới" required />
        </div>

        <div class="mt-4">
            <button type="submit" class="btn text-white px-4 py-2" style="background-color: #f36f21; border: none">
                Đổi mật khẩu
            </button>
        </div>
    </form>
</div>
