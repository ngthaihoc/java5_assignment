<div th:fragment="content" xmlns:th="http://www.thymeleaf.org">
  <h4 class="mb-4 text-uppercase fw-bold">Thông tin tài khoản</h4>

  <form action="#" method="post">
    <div class="mb-3">
      <label for="fullName" class="form-label fw-bold">Họ tên</label>
      <input type="text" class="form-control" id="fullName"
             value="Nguyễn Học" placeholder="Nhập họ tên của bạn">
    </div>

    <div class="mb-3">
      <label for="email" class="form-label fw-bold">Email</label>
      <input type="email" class="form-control" id="email"
             value="ngthaihoc.vn@gmail.com" placeholder="name@example.com">
    </div>

    <div class="mb-3">
      <label for="phone" class="form-label fw-bold">Số điện thoại</label>
      <input type="tel" class="form-control" id="phone"
             value="0963672903" placeholder="Nhập số điện thoại">
    </div>

    <div class="mt-4">
      <button type="submit" class="btn text-white px-4 py-2"
              style="background-color: #F5AFAF; border: none;">
        Cập nhật thông tin
      </button>
    </div>
  </form>
</div>
