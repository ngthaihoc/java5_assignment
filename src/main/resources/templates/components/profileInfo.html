<div th:fragment="content" xmlns:th="http://www.thymeleaf.org">
    <div class="card border-0 shadow-sm rounded-4">
        <div class="card-header bg-white py-3 border-bottom-0 pt-4">
            <h5 class="mb-0 text-uppercase fw-bold text-dark px-2">
                <i class="bi bi-person-circle me-2 text-primary"></i>Hồ sơ cá nhân
            </h5>
        </div>

        <div class="card-body p-4">
            <form th:action="@{/auth/account/update}" method="post" enctype="multipart/form-data">
                <div class="row g-4">

                    <div
                        class="col-md-4 text-center border-end d-flex flex-column align-items-center justify-content-center py-3">
                        <div class="avatar-wrapper position-relative">
                            <div class="p-1 bg-white shadow-sm rounded-circle border"
                                style="width: 160px; height: 160px;">
                                <img th:src="${#strings.isEmpty(session.user.avatar) ? '/images/defaultuser.png' : '/images/' + session.user.avatar}"
                                    class="rounded-circle w-100 h-100" style="object-fit: cover;" alt="Ảnh đại diện">
                            </div>

                            <label for="photo"
                                class="btn btn-primary btn-sm position-absolute rounded-circle shadow border border-2 border-white d-flex align-items-center justify-content-center"
                                style="width: 42px; height: 42px; bottom: 5px; right: 5px; cursor: pointer; transition: all 0.3s ease;"
                                title="Thay đổi ảnh đại diện">
                                <i class="fas fa-camera fs-6"></i>
                            </label>

                            <input type="file" id="photo" name="photo" accept="image/*" class="d-none">
                        </div>

                        <div class="mt-4 px-2">
                            <h6 class="fw-bold text-dark mb-1">Ảnh đại diện</h6>
                            <p class="text-muted mb-0" style="font-size: 0.85rem; line-height: 1.4;">
                                Tải lên ảnh mới để thay đổi diện mạo hồ sơ của bạn.
                                <span class="d-block mt-1 text-primary-emphasis fw-medium">
                                    <i class="fas fa-info-circle me-1"></i>Thay đổi sẽ có hiệu lực sau khi
                                    <b>Lưu</b>.
                                </span>
                            </p>
                        </div>
                    </div>

                    <div class="col-md-8">
                        <div class="row g-3">
                            <div class="col-12">
                                <label class="form-label fw-semibold text-secondary">Họ và tên</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white border-end-0"><i
                                            class="bi bi-person"></i></span>
                                    <input type="text" class="form-control border-start-0 ps-0" name="fullname"
                                        th:value="${session.user.fullname}" placeholder="Ví dụ: Nguyễn Văn A" required>
                                </div>
                            </div>

                            <div class="col-12">
                                <label class="form-label fw-semibold text-secondary">Địa chỉ Email</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i
                                            class="bi bi-envelope-at"></i></span>
                                    <input type="email" class="form-control bg-light border-start-0 ps-0 text-muted"
                                        th:value="${session.user.email}" readonly tabindex="-1">
                                </div>
                                <div class="form-text" style="font-size: 0.8rem;">
                                    <i class="bi bi-lock-fill me-1"></i>Email được dùng để đăng nhập và không thể
                                    thay
                                    đổi.
                                </div>
                            </div>

                            <div class="col-12 mt-5 text-end">
                                <hr class="text-muted opacity-25">
                                <button type="submit" class="btn btn-lg text-white px-5 py-2 shadow-sm"
                                    style="background-color: #F5AFAF; border: none; font-size: 0.95rem; border-radius: 10px;">
                                    <i class="bi bi-save2 me-2"></i>Lưu thay đổi
                                </button>
                            </div>
                        </div>
                    </div>

                </div>
            </form>
        </div>
    </div>
</div>
