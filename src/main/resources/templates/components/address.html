<div th:fragment="content" xmlns:th="http://www.thymeleaf.org">
  <h4 class="mb-4 text-uppercase fw-bold">Địa chỉ của bạn</h4>

  <button type="button" class="btn text-white mb-4" style="background-color: #F5AFAF;" data-bs-toggle="modal"
          data-bs-target="#addAddressModal">
    Thêm địa chỉ
  </button>

  <div class="row g-3">
    <div class="col-md-6">
      <div class="card h-100 shadow-sm border-0 bg-light">
        <div class="card-body position-relative">
          <span class="badge position-absolute top-0 end-0 m-2 " style="background-color: #F9DFDF;">Mặc định</span>
          <h6 class="card-title fw-bold text-uppercase">Nguyễn Thái Học</h6>
          <p class="card-text mb-1"><small class="text-muted">Công ty:</small> Alpha Books</p>
          <p class="card-text mb-1"><small class="text-muted">Địa chỉ:</small> Tòa nhà Dream Center, Thanh
            Xuân</p>
          <p class="card-text mb-1"><small class="text-muted">Điện thoại:</small> 0963672903</p>
          <div class="mt-3">
            <a href="#" class="text-primary text-decoration-none small me-2">Sửa</a>
            <a href="#" class="text-danger text-decoration-none small">Xóa</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="addAddressModal" tabindex="-1" aria-labelledby="addAddressModalLabel"
       aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fw-bold text-uppercase" id="addAddressModalLabel">Thêm địa chỉ mới</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form class="row g-3">
            <div class="col-md-12">
              <input type="text" class="form-control" placeholder="Họ tên" value="Nguyễn Thái Học">
            </div>
            <div class="col-md-12">
              <input type="text" class="form-control" placeholder="Số điện thoại" value="0963672903">
            </div>
            <div class="col-md-12">
              <input type="text" class="form-control" placeholder="Công ty">
            </div>
            <div class="col-md-12">
              <input type="text" class="form-control" placeholder="Địa chỉ">
            </div>
            <div class="col-md-12">
              <select class="form-select">
                <option selected>Vietnam</option>
                <option>Other...</option>
              </select>
            </div>
            <div class="col-md-4">
              <select class="form-select">
                <option selected>Tây Ninh</option>
                <option>Hà Nội</option>
              </select>
            </div>
            <div class="col-md-4">
              <select class="form-select">
                <option selected>Quận huyện</option>
              </select>
            </div>
            <div class="col-md-4">
              <input type="text" class="form-control" placeholder="Phường xã" disabled>
            </div>
            <div class="col-md-12">
              <input type="text" class="form-control" placeholder="Mã Zip">
            </div>
            <div class="col-12">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="defaultAddress">
                <label class="form-check-label" for="defaultAddress">
                  Đặt là địa chỉ mặc định?
                </label>
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer border-0">
          <button type="button" class="btn btn-light border" data-bs-dismiss="modal">Hủy</button>
          <button type="button" class="btn text-white" style="background-color: #F5AFAF;">Thêm địa
            chỉ</button>
        </div>
      </div>
    </div>
  </div>
</div>
