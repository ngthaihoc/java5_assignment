<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{views/layout :: layout(~{::body})}">

<body>
    <link th:href="@{/css/home.css}" rel="stylesheet" />

    <div class="container my-4">
        <section id="main-slider" class="mb-5">
            <div id="carouselExampleIndicators" class="carousel slide" data-bs-ride="carousel">
                <div class="carousel-indicators">
                    <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0"
                        class="active" aria-current="true" aria-label="Slide 1"></button>
                    <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1"
                        aria-label="Slide 2"></button>
                    <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="2"
                        aria-label="Slide 3"></button>
                </div>

                <div class="carousel-inner">
                    <div class="carousel-item active" data-bs-interval="2000">
                        <img th:src="@{/images/slider_3.png}" class="d-block w-100" alt="Banner 1" />
                    </div>

                    <div class="carousel-item" data-bs-interval="2000">
                        <img th:src="@{/images/slider_4.png}" class="d-block w-100" alt="Banner 2" />
                    </div>

                    <div class="carousel-item" data-bs-interval="2000">
                        <img th:src="@{/images/slider_5.png}" class="d-block w-100" alt="Banner 3" />
                    </div>
                </div>
            </div>
        </section>

        <section id="top-selling" class="mb-5">
            <div class="text-center mb-4">
                <h2 class="text-uppercase fw-bold">Top 8 Sản Phẩm Bán Chạy</h2>
                <div class="d-inline-block border-bottom border-warning border-3" style="width: 50px"></div>
            </div>

            <div class="row g-4">
                <div class="col-6 col-md-3" th:each="book :${topBooks}">
                    <div class="card h-100 shadow-sm product-card">
                        <div class="position-relative overflow-hidden">
                            <a th:href="@{/book/{id}(id=${book.id})}">
                                <div class="product-img-wrapper">
                                    <img class="product-img" th:src="${#strings.isEmpty(book.image)
              ? '/images/books/default-book.png'
              : '/images/books/' + book.image}" th:alt="${book.title}" />
                                </div>
                            </a>
                        </div>

                        <div class="card-body d-flex flex-column">
                            <small class="text-muted mb-1" th:text="${book.authorName}">Tên tác giả</small>

                            <h5 class="card-title fs-6 fw-bold">
                                <a th:href="@{/book/{id}(id=${book.id})}" class="text-dark text-decoration-none"
                                    th:text="${book.title}">
                                    Tên sách
                                </a>
                            </h5>

                            <div class="mt-auto">
                                <div class="d-flex align-items-center mb-2">
                                    <span class="fw-bold text-danger fs-5 me-2"
                                        th:text="${#numbers.formatDecimal(book.price, 0, 'COMMA', 0, 'POINT')} + 'đ'">0đ</span>
                                </div>

                                <!-- Thêm chức năng thêm vào giỏ hàng ở đây-->
                                <form th:action="@{/cart/add}" method="post">
                                    <input type="hidden" name="bookId" th:value="${book.id}" />
                                    <div class="d-grid gap-2">
                                        <button type="submit" class="btn btn-sm btn-addtocart">
                                            <i class="fas fa-shopping-cart me-1"></i> Thêm vào giỏ
                                        </button>
                                    </div>
                                </form>
                                <div th:if="${success}"
                                    class="alert alert-success alert-dismissible fade show mt-3 w-50">
                                    <span th:text="${success}"></span>
                                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Testing -->
            </div>
        </section>

        <section id="small-banners" class="mb-5">
            <div class="row g-4">
                <div class="col-12 col-md-6">
                    <a href="#" class="d-block overflow-hidden rounded shadow-sm position-relative group-hover">
                        <img th:src="@{/images/slider_1.png}" class="w-100" alt="Banner nhỏ 1" style="
                  height: 200px;
                  object-fit: cover;
                  transition: transform 0.5s ease;
                " />
                    </a>
                </div>

                <div class="col-12 col-md-6">
                    <a href="#" class="d-block overflow-hidden rounded shadow-sm position-relative group-hover">
                        <img th:src="@{/images/slider_2.png}" class="w-100" alt="Banner nhỏ 2" style="
                  height: 200px;
                  object-fit: cover;
                  transition: transform 0.5s ease;
                " />
                    </a>
                </div>
            </div>
        </section>

        <section id="new-releases" class="mb-5">
            <div class="text-center mb-5">
                <h2 class="text-uppercase fw-bold">Sách Mới Phát Hành</h2>
                <div class="d-inline-block border-bottom border-warning border-3" style="width: 50px"></div>
            </div>

            <div class="row align-items-center">
                <div class="col-12 col-md-4 mb-4 mb-md-0">
                    <span class="badge bg-warning text-dark mb-2">Mới Phát Hành</span>
                    <h3 class="fw-bold display-6" th:text="${lastestBook.title}">
                        Tên Sách
                    </h3>
                    <p class="text-muted lead fs-6" th:text="${lastestBook.description}">
                        Chi tiết
                    </p>

                    <div class="d-flex align-items-end mb-4">
                        <span class="fw-bold text-danger display-6 me-3"
                            th:text="${#numbers.formatDecimal(lastestBook.price, 0, 'COMMA', 0, 'POINT')} + 'đ'">0đ</span>
                    </div>

                    <form th:action="@{/cart/add}" method="post">
                        <input type="hidden" name="bookId" th:value="${lastestBook.id}" />
                        <button type="submit" class="btn btn-dark btn-lg rounded-pill px-4 w-100 shadow">
                            <i class="fas fa-shopping-cart me-2"></i> ĐẶT MUA SÁCH NGAY
                        </button>
                    </form>
                    <div class="mt-2 text-center text-muted small">
                        <i class="fas fa-truck me-1"></i> Miễn phí vận chuyển toàn quốc
                    </div>
                </div>

                <div class="col-12 col-md-4 text-center mb-4 mb-md-0">
                    <a th:href="@{/book/{id}(id=${lastestBook.id})}">
                        <img th:src="${#strings.isEmpty(lastestBook.image)
                                  ? '/images/books/default-book.png'
                                  : '/images/books/' + lastestBook.image}" class="card-img-top p-3 rounded"
                            th:alt="${lastestBook.title}" />
                    </a>
                </div>

                <div class="col-12 col-md-4">
                    <h5 class="fw-bold mb-3 border-start border-4 border-warning ps-2">
                        Có thể bạn quan tâm
                    </h5>

                    <div class="row row-cols-2 g-3">
                        <div class="col" th:each="related : ${relatedNewBooks}">
                            <div class="card h-100 shadow-sm">
                                <a class="text-decoration-none" th:href="@{/book/{id}(id=${related.id})}">
                                    <div class="product-img-wrapper product-img-wrapper--sm">
                                        <img class="product-img" th:src="${#strings.isEmpty(related.image)
          ? '/images/books/default-book.png'
          : '/images/books/' + related.image}" th:alt="${related.title}" />
                                    </div>

                                    <div class="card-body p-2 text-center">
                                        <h6 class="card-title fs-6 mb-1 text-truncate" th:text="${related.title}">
                                            Tên sách
                                        </h6>
                                        <div class="fw-bold text-danger small"
                                            th:text="${#numbers.formatDecimal(related.price, 0, 'COMMA', 0, 'POINT')} + 'đ'">
                                            0đ
                                        </div>
                                    </div>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section id="books-for-you" class="mb-5 pb-5">
            <div class="text-center mb-3">
                <h2 class="text-uppercase fw-bold">Sách Dành Cho Bạn</h2>
            </div>

            <div class="d-flex justify-content-center mb-4 gap-2">
                <a class="btn btn-outline-dark" th:href="@{/home#books-for-you}"
                    th:classappend="${param.cateid == null } ? 'active'">Tất cả</a>

                <a class="btn btn-outline-dark" th:each=" cate : ${categories}"
                    th:href="@{/home(cateid=${cate.id})} + '#books-for-you'" th:text="${cate.name}"
                    th:classappend="${#strings.equals(param.cateid, cate.id)} ? 'active'">Tên Thể Loại</a>
            </div>

            <div class="row g-4">
                <div class="col-6 col-md-3" th:each="book : ${booksForYou}">
                    <div class="card h-100 shadow-sm product-card">
                        <div class="position-relative overflow-hidden">
                            <a th:href="@{/book/{id}(id=${book.id})}">
                                <div class="product-img-wrapper">
                                    <img class="product-img" th:src="${#strings.isEmpty(book.image)
              ? '/images/books/default-book.png'
              : '/images/books/' + book.image}" th:alt="${book.title}" />
                                </div>
                            </a>
                        </div>

                        <div class="card-body d-flex flex-column">
                            <small class="text-muted mb-1" th:text="${book.authorName}">Tên tác giả</small>

                            <h5 class="card-title fs-6 fw-bold" th:text="${book.title}">
                                Tên Sách
                            </h5>

                            <div class="mt-auto">
                                <div class="d-flex align-items-center mb-2">
                                    <span class="fw-bold text-danger fs-5 me-2"
                                        th:text="${#numbers.formatDecimal(book.price, 0, 'COMMA', 0, 'POINT')} + 'đ'">0đ</span>
                                </div>

                                <form th:action="@{/cart/add/{id}(id=${book.id})}" method="post">
                                    <input type="hidden" name="bookId" th:value="${book.id}" />
                                    <div class="d-grid gap-2">
                                        <button type="submit" class="btn btn-outline-dark btn-sm btn-addtocart">
                                            <i class="fas fa-shopping-cart me-1"></i> Thêm vào giỏ
                                        </button>
                                    </div>
                                </form>
                            </div>
                            <script th:if="${success}">
                                alert("[[${success}]]");
                            </script>
                        </div>
                    </div>
                </div>

                <div class="col-12 text-center text-muted" th:if="${booksForYou.empty}">
                    <p>Hiện chưa có sách thuộc thể loại này.</p>
                </div>
            </div>
        </section>
    </div>

    <body />
</body>

</html>
